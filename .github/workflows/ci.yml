name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci
      - run: npm run build
      - run: node dist/cra.mjs --version

  # The action exactly as a user runs it, from this ref (no bundled dist, so it
  # builds from source), against a small npm project.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: cra
        uses: ./ # zizmor: ignore[self-repository] actionlint does not support $/ yet
        with:
          working-directory: test/fixtures/action
          fail-on: none
          artifact-name: cra-compliance-fixture
      - name: Check the outputs
        env:
          VERDICT: ${{ steps.cra.outputs.verdict }}
          OUT: ${{ steps.cra.outputs.output-dir }}
        run: |
          set -euo pipefail
          test "$VERDICT" = in_scope
          test -s "test/fixtures/action/$OUT/sbom.cdx.json"
          test -s "test/fixtures/action/$OUT/index.md"

  # Lints the workflows and action.yml: actionlint for syntax and shell,
  # zizmor for security (unpinned actions, injection, credential leaks).
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low
