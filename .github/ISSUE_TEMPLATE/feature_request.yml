name: Feature request
description: A new lockfile format, document, check or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you need and why
      description: The situation you are in, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: cra-reference
    attributes:
      label: CRA reference
      description: Article, annex or recital this relates to, if any.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
