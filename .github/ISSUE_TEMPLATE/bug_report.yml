name: Bug report
description: cra or the GitHub Action does something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: report them privately through the Security tab, not here.
  - type: input
    id: version
    attributes:
      label: cra version
      description: Output of `cra --version`, or the action ref (e.g. `override-tech/releasekeep@v0`).
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or workflow step
      placeholder: cra all --offline
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Include the full error output. Remove anything confidential.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The relevant part of cra.yml and the lockfile type (package-lock.json, poetry.lock, ...).
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 24, macOS 15 / ubuntu-latest runner
