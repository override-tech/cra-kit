version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new versions age a week before proposing them (supply-chain attacks
    # are usually caught and yanked within days). Security updates ignore this.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Covers .github/workflows and the composite action.yml at the root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
